# ============================================================
# Structured Logging Configuration
# Used by logging.config.dictConfig()
# ============================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(funcName)s() | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    # Use python-json-logger for production JSON logging
    # pip install python-json-logger
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file_rotating:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/churn_prediction.log
    maxBytes: 10485760    # 10 MB
    backupCount: 5
    encoding: utf-8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 5242880     # 5 MB
    backupCount: 3
    encoding: utf-8

  api_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/api_requests.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  # Root logger
  "":
    level: INFO
    handlers: [console, file_rotating, error_file]
    propagate: false

  # API-specific logger (request logs go to dedicated file)
  api:
    level: INFO
    handlers: [console, api_file]
    propagate: false

  # Suppress noisy third-party loggers
  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console]
    propagate: false

  lightgbm:
    level: WARNING
    handlers: [console]
    propagate: false

  optuna:
    level: WARNING
    handlers: [console]
    propagate: false
