[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "churn-prediction"
version = "1.0.0"
description = "End-to-end customer churn prediction system with FastAPI deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["machine-learning", "churn-prediction", "lightgbm", "fastapi", "mlops"]

dependencies = [
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "joblib>=1.4.0",
    "optuna>=3.6.0",
    "shap>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.21.0",
]

[project.scripts]
churn-train = "train_pipeline:run_pipeline"
churn-predict = "predict:run_batch_inference"

# ── Ruff Linter & Formatter ────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git", "__pycache__", ".venv", "notebooks",
    "build", "dist", "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function call in default argument (FastAPI Depends)
    "N803",  # Argument name should be lowercase (X_train convention)
    "N806",  # Variable in function should be lowercase (X, y convention)
]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]

# ── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ── Coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "api"]
omit = ["tests/*", "notebooks/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError",
]
show_missing = true
fail_under = 70
