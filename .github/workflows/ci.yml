name: CI / CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: churnscope

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles("requirements.txt") }}
      - run: pip install ruff
      - run: ruff check src/ api/ tests/ train_pipeline.py predict.py
      - run: ruff format --check src/ api/ tests/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles("requirements.txt") }}
      - run: pip install --upgrade pip && pip install -r requirements.txt pytest pytest-asyncio httpx pytest-cov
      - run: mkdir -p data/raw data/processed data/features models/trained models/artifacts models/registry logs
      - run: python train_pipeline.py --synthetic --n-samples 2000
      - run: pytest tests/ -v --cov=src --cov=api --cov-report=xml --cov-report=term-missing -x
      - uses: codecov/codecov-action@v4
        with: {file: ./coverage.xml, fail_ci_if_error: false}

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target production --tag ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }} .
      - run: mkdir -p models/trained models/artifacts models/registry data/raw logs && python train_pipeline.py --synthetic --n-samples 1000
      - name: Smoke test
        run: |
          docker run -d --name churnscope-test -p 8000:8000 -v $(pwd)/models:/app/models -v $(pwd)/logs:/app/logs ${{ env.DOCKER_IMAGE }}:ci-${{ github.sha }}
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          [ "$STATUS" = "200" ] && echo "PASSED" || (echo "FAILED" && exit 1)
      - if: always()
        run: docker rm -f churnscope-test || true

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == "refs/heads/main" && github.event_name == "push"
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/churnscope
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
