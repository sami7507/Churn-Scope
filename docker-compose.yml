# ============================================================
# Customer Churn Prediction System — Docker Compose
# Local development and staging orchestration
# ============================================================

version: "3.9"

services:

  # ---- Main API Service ----
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: churn_prediction_api
    image: churn-prediction:latest
    ports:
      - "8000:8000"
    volumes:
      # Mount model artifacts and data so they persist across restarts
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - churn-network

  # ---- Optional: Prometheus metrics scraping ----
  # Uncomment to enable monitoring stack
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: churn_prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - churn-network

  # ---- Optional: Grafana dashboard ----
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: churn_grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   networks:
  #     - churn-network

networks:
  churn-network:
    driver: bridge

volumes:
  churn-models:
  churn-logs:
