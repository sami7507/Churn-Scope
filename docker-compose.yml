version: "3.9"
services:
  churnscope-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: churnscope_api
    image: churnscope:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - churnscope-network

networks:
  churnscope-network:
    driver: bridge

volumes:
  churnscope-models:
  churnscope-logs:
